# dsh-plugin-ai-council 的 bundle patch。
#
# 把插件挂进 dsh profile 的 host 组合：工具注册进共享的 tools 注册表，
# 用法说明注册进全局 system prompt，所以任何会话都能用自然语言唤醒它
# （例如「用 AI 审批 + 人工审批流程做 X」）。
#
# 安装：dsh plugin --profile <name> add <这个目录>
- insert:
    - id: ai-council
      name: 'dsh-plugin-ai-council'
      config:
        # django-generic-websocket-project 的地址。
        # 这个服务可以完全脱离 DSH 单独部署（docker / supervisor / runserver）。
        busUrl: http://127.0.0.1:7420

        # AI 反馈之后留给人类的打断窗口，单位毫秒。
        humanWindowMs: 3000

        # 人类按下「打断」之后，愿意等他慢慢看、再决定「恢复循环」还是
        # 「加入建议」的最长时间，单位毫秒。超时后工具会把控制权交还给
        # DeepSeek，由它在对话里继续问你。
        humanWaitMs: 600000

        # 单次长轮询请求的上限，单位毫秒。
        # **必须小于服务端 generic/council.py 的 MAX_WAIT_SECONDS（60 秒）**，
        # 否则服务端会把它静默截断，humanWaitMs 配的时长就会缩水。
        # 走 nginx 时注意 proxy_read_timeout（默认也是 60 秒），要一起调。
        pollWindowMs: 55000

        # 单个模型评审的超时时间。
        # Kimi（思考模式 + 长计划）实测会超过 3 分钟，给足余量。
        reviewTimeoutMs: 480000

        # 参与评审的异模型。
        #
        # kimi 走本机已登录的 kimi CLI（Kimi For Coding 订阅，无需 API key）。
        #   注意：它直接使用你真实的 ~/.kimi-code。令牌失效时 CLI 会把凭据
        #   清空，所以这里跑失败之后要用 `kimi login` 重新授权。
        #
        # claude 只是「Anthropic 协议」这个适配器的名字，不是模型名。
        #   下面这套指向 DeepSeek 的 Anthropic 兼容端点（与本机
        #   ANTHROPIC_BASE_URL / ANTHROPIC_AUTH_TOKEN 一致），已实测 HTTP 200：
        #   - 鉴权是 `Authorization: Bearer`（authStyle: bearer），不是 x-api-key；
        #   - DSH 进程未必继承你 shell 里的 export，所以用 apiKeyFile 直接指向
        #     那个 rc 文件，按 apiKeyEnv 给的名字去里面找（支持 ~ 展开）。
        #   接真 Claude 就改成 baseUrl: https://api.anthropic.com、
        #   apiKeyEnv: ANTHROPIC_API_KEY、authStyle: api-key，并去掉 apiKeyFile。
        participants:
          kimi:
            adapter: kimi-cli
            label: Kimi
          claude:
            adapter: claude-api
            label: DeepSeek（Anthropic 接口）
            baseUrl: https://api.deepseek.com/anthropic
            apiKeyEnv: ANTHROPIC_AUTH_TOKEN
            apiKeyFile: ~/github/secret/bashrc
            authStyle: bearer
            model: deepseek-v4-pro[1m]
            maxTokens: 8192
            # 这个端点默认开思考，而且会把 max_tokens 全花在 thinking 上，
            # 正文就空了（实测同一配置时好时坏）。显式关掉最可靠也最省：
            # 同一条评审 prompt，关掉思考只花 240 个输出 token 就给出了完整结论。
            # 想开思考就改成 budget（配合 thinkingBudgetTokens）。
            thinking: disabled
